<div class="header-div">
    <div class="header-logo">
        <img src="snailpanel.png" alt="">
    </div>
    <div class="header-title">Snailpanel</div>
    <div class="header-actions">
        <p-button icon="pi pi-lightbulb" size="large"></p-button>
        @if (authService.isAuthenticated) {
            <p-button icon="pi pi-user" size="large" (onClick)="logout()"></p-button>
            <a>{{authService.activeUser}}</a>
        }
    </div>
</div>
